name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verification only. Deploys stay manual (`firebase deploy`) — they need project
# credentials and a human deciding that live is ready for it.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The game is a submodule (its own repo) — without this the build has no game.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
