name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verification only. Deploys stay manual (`firebase deploy`) — they need project
# credentials and a human deciding that live is ready for it.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The game is a submodule (its own repo) — without this the build has no game.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # Only the rules that are already at zero, so this starts green and every failure is a
      # regression somebody made today. eslint-plugin-react-hooks was a dependency for months
      # while nothing ran it, and a hook below an early return reached live as a crash on every
      # event opened. See scripts/lint-gate.mjs.
      - name: Lint gate
        run: npm run lint:gate

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The Firestore rules are the only thing standing between a browser and the data, and until
      # 2026-09-20 nothing in CI ran a single one of the 207 tests that probe them. They needed a
      # JDK and an emulator, so they stayed a local-only gate — which means they only ran when
      # somebody remembered, on the change where they mattered least.
      #
      # The concrete thing this catches: `rules-tests/ai-config.test.ts` exists to refuse an
      # ADMIN write to `aiConfig`, because a future contributor adding `exists(/admins/$(uid))`
      # there would look like they were fixing something and would quietly move a money control
      # behind a door any admin can open. Nothing would have noticed.
      - name: Set up JDK for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Rules tests
        run: npm run test:rules
