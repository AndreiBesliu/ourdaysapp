name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verification only. Deploys stay manual (`firebase deploy`) — they need project
# credentials and a human deciding that live is ready for it.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The game is a submodule (its own repo) — without this the build has no game.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          # 22, the Cloud Functions runtime since 24.09.2026. Node 20 is decommissioned there on
          # 30.10.2026, after which functions on it can no longer even be deployed.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # functions/ has its own package.json and nothing installed it here, so nothing typechecked it
      # either — a broken Cloud Function reached CI green and failed only at deploy. And the
      # callable tests under functions/test import firebase-admin from THIS install.
      - name: Install functions
        run: npm ci --prefix functions

      - name: Typecheck functions
        working-directory: functions
        run: npx tsc --noEmit -p .

      # functions/lib (the compiled output) is COMMITTED, and on 24.09.2026 it lagged its source for
      # five commits: each ran `tsc --noEmit`, which is not a build. Deploys were safe (the predeploy
      # builds) but the repository said one thing in src/ and another in lib/. This fails CI when
      # they disagree.
      - name: Compiled functions match their source
        run: |
          npm --prefix functions run build
          git diff --exit-code --stat -- functions/lib
          test -z "$(git status --porcelain -- functions/lib)"

      - name: Typecheck
        run: npx tsc -b

      # Only the rules that are already at zero, so this starts green and every failure is a
      # regression somebody made today. eslint-plugin-react-hooks was a dependency for months
      # while nothing ran it, and a hook below an early return reached live as a crash on every
      # event opened. See scripts/lint-gate.mjs.
      - name: Lint gate
        run: npm run lint:gate

      - name: Tests
        run: npm test

      # CI runs in UTC, where a local date formatter and a UTC one print the same day — so every
      # recurrence defect found on 24.09.2026 was invisible here. These run the zone-sensitive
      # tests again under Bucharest (DST in March and October) and New York (west of UTC).
      - name: Zone tests
        run: npm run test:tz

      - name: Build
        run: npm run build

      # The Firestore rules are the only thing standing between a browser and the data, and until
      # 2026-09-20 nothing in CI ran a single one of the 207 tests that probe them. They needed a
      # JDK and an emulator, so they stayed a local-only gate — which means they only ran when
      # somebody remembered, on the change where they mattered least.
      #
      # The concrete thing this catches: `rules-tests/ai-config.test.ts` exists to refuse an
      # ADMIN write to `aiConfig`, because a future contributor adding `exists(/admins/$(uid))`
      # there would look like they were fixing something and would quietly move a money control
      # behind a door any admin can open. Nothing would have noticed.
      - name: Set up JDK for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `scripts/test-rules.mjs` shells out to `npx firebase emulators:exec`, and `firebase-tools`
      # is NOT a dependency of this repo — it is globally installed on the developer machine. The
      # first CI run of this step failed with “could not determine executable to run” for exactly
      # that reason. Installed here rather than added to package.json: it is a 100MB CLI that only
      # this job needs, and pinning it in devDependencies would put it in every `npm ci`.
      - name: Install the Firebase CLI
        run: npm i -g firebase-tools@13

      - name: Rules tests
        run: npm run test:rules
