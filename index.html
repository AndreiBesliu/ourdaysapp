<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
      // The `app_version` gate that used to live here compared a HARDCODED literal that nobody
      // ever bumped past 'v1.0.2', and it only ran when a fresh index.html was parsed — which is
      // precisely the case that was never stale. Its job is now done properly in two places:
      // `no-cache` on the entry document (firebase.json), so a reload really does fetch new code,
      // and `src/utils/appVersion.ts`, which compares the running bundle hash against the served
      // one and offers a reload instead of forcing it.
    </script>
    <title>Our Days ✨</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
